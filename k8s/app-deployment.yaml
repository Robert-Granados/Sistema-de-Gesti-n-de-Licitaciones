apiVersion: apps/v1
kind: Deployment
metadata:
  name: licitaciones-app
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: licitaciones-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: licitaciones-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
              until [ "$(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$EXPECTED_MIGRATION'")" = "1" ]; do
                echo "Esperando migración $EXPECTED_MIGRATION"
                sleep 3
              done
          envFrom:
            - configMapRef:
                name: licitaciones-config
            - secretRef:
                name: licitaciones-secrets
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: licitaciones-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: licitaciones-config
            - secretRef:
                name: licitaciones-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data-protection
          emptyDir: {}
        - name: temp
          emptyDir: {}

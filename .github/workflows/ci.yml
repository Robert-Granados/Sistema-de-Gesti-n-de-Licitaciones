name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_USER: licitaciones_ci
  POSTGRES_PASSWORD: licitaciones_ci_password
  POSTGRES_DB: licitaciones_ci
  POSTGRES_PORT: 5433
  APP_PORT: 8080
  APP_BASE_URL: http://localhost:8080

jobs:
  build:
    name: Compilar y verificar la solución
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Compilar en Release
        run: dotnet build SistemaLicitaciones.sln -c Release

      - name: Ejecutar pruebas unitarias
        run: dotnet test tests/Licitaciones.UnitTests -c Release --no-build

      - name: Ejecutar pruebas de contrato funcionales
        run: dotnet test tests/Licitaciones.FunctionalTests -c Release --no-build

  cobertura:
    name: Cobertura de código y umbrales
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar herramientas locales
        run: dotnet tool restore

      - name: Compilar en Release
        run: dotnet build SistemaLicitaciones.sln -c Release

      - name: Ejecutar pruebas unitarias con cobertura
        run: dotnet test tests/Licitaciones.UnitTests -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/cobertura

      - name: Ejecutar pruebas de contrato funcionales con cobertura
        run: dotnet test tests/Licitaciones.FunctionalTests -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/cobertura

      - name: Ejecutar pruebas de integración con cobertura
        run: dotnet test tests/Licitaciones.IntegrationTests -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/cobertura

      - name: Generar reporte de cobertura
        run: |
          dotnet reportgenerator -reports:"TestResults/cobertura/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/reporte" \
            -reporttypes:"HtmlInline_AzurePipelines_Dark;Cobertura" \
            -assemblyfilters:"+Licitaciones.Domain;+Licitaciones.Application;+Licitaciones.Infrastructure" \
            -filefilters:"-**/obj/**;-**/Persistence/Migrations/**"

      - name: Verificar umbrales de cobertura
        run: python3 tools/check-coverage.py TestResults/cobertura

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura
          path: TestResults/reporte/

  test-funcionales-playwright:
    name: Pruebas funcionales de extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Compilar el proyecto de pruebas funcionales
        run: dotnet build tests/Licitaciones.BrowserTests -c Release

      - name: Instalar navegadores de Playwright
        run: pwsh tests/Licitaciones.BrowserTests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Levantar la aplicación y PostgreSQL con Docker Compose
        run: docker compose up -d --build

      - name: Esperar a que la aplicación esté disponible
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent "http://localhost:${APP_PORT}/health" > /dev/null; then
              echo "La aplicación está disponible."
              exit 0
            fi
            echo "Esperando a la aplicación... (intento $i/60)"
            sleep 5
          done
          echo "La aplicación no respondió a tiempo." >&2
          docker compose logs app
          exit 1

      - name: Ejecutar las pruebas funcionales (Playwright)
        run: dotnet test tests/Licitaciones.BrowserTests -c Release --no-build --logger "trx;LogFileName=funcionales.trx" --results-directory TestResults

      - name: Subir resultados de las pruebas funcionales
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-funcionales
          path: TestResults/

      - name: Detener los contenedores
        if: always()
        run: docker compose down -v
